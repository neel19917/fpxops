<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      padding: 16px;
      margin: 0;
      color: #1a1a1a;
    }
    h3 {
      margin: 0 0 12px;
      font-size: 15px;
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 3px;
    }
    input, select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
    }
    .hint {
      font-size: 11px;
      color: #6b7280;
      margin-top: 2px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }
    button {
      flex: 1;
      padding: 8px 0;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    #startBtn {
      background: #2563eb;
      color: #fff;
    }
    #stopBtn {
      background: #dc2626;
      color: #fff;
    }
    #status {
      background: #f3f4f6;
      border-radius: 4px;
      padding: 10px;
      min-height: 20px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h3>FPXpress Tracking Refresh</h3>

  <div class="field">
    <label for="filterCol">Filter Column</label>
    <select id="filterCol">
      <option value="">-- No Filter --</option>
      <option value="Mode">Mode</option>
      <option value="Shipment status">Shipment status</option>
      <option value="Carrier Name">Carrier Name</option>
      <option value="Company Name">Company Name</option>
    </select>
  </div>

  <div class="field">
    <label for="filterVal">Filter Value</label>
    <select id="filterVal">
      <option value="">-- Select --</option>
    </select>
    <div class="hint">Pick a column first, then choose a value.</div>
  </div>

  <div class="btn-row">
    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>
  </div>
  <div id="status">Ready. Set your filter, then click Start.</div>
  <script src="popup.js"></script>
</body>
</html>
