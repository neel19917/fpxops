<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      padding: 16px;
      margin: 0;
      color: #1a1a1a;
      text-align: center;
    }
    h3 {
      margin: 0 0 12px;
      font-size: 15px;
    }
    .badges {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 14px;
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .badge.ok { background: #dcfce7; color: #166534; }
    .badge.missing { background: #fee2e2; color: #991b1b; }
    .badge .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .badge.ok .dot { background: #22c55e; }
    .badge.missing .dot { background: #ef4444; }
    #openBtn {
      width: 100%;
      padding: 10px 0;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
    }
    #openBtn:hover { opacity: 0.9; }
    .hint {
      font-size: 11px;
      color: #6b7280;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h3>FPXpress Tracking Refresh</h3>
  <div class="badges">
    <span id="apiBadge" class="badge missing">No API Key</span>
    <span id="serverBadge" class="badge missing"><span class="dot"></span> Offline</span>
  </div>
  <button id="openBtn">Open Side Panel</button>
  <div class="hint">The side panel stays open while you work.</div>
  <script src="popup.js"></script>
</body>
</html>
