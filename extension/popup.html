<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --fp-blue-50:  #eff6ff;
      --fp-blue-100: #dbeafe;
      --fp-blue-500: #0ea5e9;
      --fp-blue-600: #2563eb;
      --fp-blue-700: #1d4ed8;
      --fp-slate-50: #f8fafc;
      --fp-slate-100:#f1f5f9;
      --fp-slate-200:#e2e8f0;
      --fp-slate-300:#cbd5e1;
      --fp-slate-500:#64748b;
      --fp-slate-700:#334155;
      --fp-slate-900:#0f172a;
      --fp-emerald-50: #ecfdf5;
      --fp-emerald-100:#d1fae5;
      --fp-emerald-600:#059669;
      --fp-emerald-700:#047857;
      --fp-rose-50:    #fff1f2;
      --fp-rose-600:   #e11d48;
      --fp-rose-700:   #be123c;
    }
    * { box-sizing: border-box; }
    body {
      width: 320px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: var(--fp-slate-900);
      background: #fff;
    }

    /* ── Branded header ─────────────────────────────── */
    .header {
      background: linear-gradient(135deg, var(--fp-blue-500) 0%, var(--fp-blue-600) 100%);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.5px;
    }
    .brand-name {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.1;
    }
    .brand-tag {
      font-size: 11px;
      opacity: 0.85;
      line-height: 1.2;
      margin-top: 1px;
    }

    /* ── Body ───────────────────────────────────────── */
    .body { padding: 16px; }

    /* Status pill (single, plain-language) */
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--fp-slate-200);
      background: var(--fp-slate-50);
      margin-bottom: 14px;
    }
    .status .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--fp-slate-300);
      flex: none;
    }
    .status.connected { background: var(--fp-emerald-50); border-color: #a7f3d0; }
    .status.connected .dot { background: var(--fp-emerald-600); box-shadow: 0 0 0 3px rgba(5,150,105,0.18); }
    .status.connected .label { color: var(--fp-emerald-700); }
    .status.setup    { background: #fef3c7; border-color: #fde68a; }
    .status.setup    .dot { background: #d97706; }
    .status.setup    .label { color: #92400e; }
    .status .label   { font-weight: 600; font-size: 12px; }
    .status .sub     { font-size: 11px; color: var(--fp-slate-500); margin-top: 1px; }

    /* Primary action */
    .btn-primary {
      width: 100%;
      padding: 11px 0;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, var(--fp-blue-500), var(--fp-blue-600));
      color: #fff;
      transition: filter 0.15s, transform 0.05s;
      box-shadow: 0 1px 2px rgba(15,23,42,0.08);
    }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-primary:active { transform: translateY(1px); }
    .btn-primary[disabled] { opacity: 0.55; cursor: default; filter: none; }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--fp-slate-200);
      color: var(--fp-slate-700);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-ghost:hover { background: var(--fp-slate-100); }

    .hint {
      font-size: 11px;
      color: var(--fp-slate-500);
      margin-top: 8px;
      text-align: center;
    }

    /* ── Setup form ─────────────────────────────────── */
    .setup {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border: 1px solid var(--fp-slate-200);
      border-radius: 10px;
      background: var(--fp-slate-50);
    }
    .setup.visible { display: block; }
    .setup h4 {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--fp-slate-700);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .setup-step {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .setup-step .num {
      flex: none;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--fp-blue-100);
      color: var(--fp-blue-700);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }
    .setup-step .body-col { flex: 1; min-width: 0; }
    .setup-step label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--fp-slate-700);
      margin-bottom: 4px;
    }
    .setup-step input {
      width: 100%;
      padding: 7px 9px;
      font-size: 12px;
      border: 1px solid var(--fp-slate-300);
      border-radius: 6px;
      font-family: inherit;
      background: #fff;
    }
    .setup-step input:focus {
      outline: none;
      border-color: var(--fp-blue-500);
      box-shadow: 0 0 0 3px rgba(14,165,233,0.18);
    }
    .setup-step input.mono {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
    }
    .setup-actions {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }
    .setup-actions .btn-primary { padding: 8px 0; font-size: 13px; }
    .save-msg {
      margin-top: 8px;
      font-size: 11px;
      min-height: 14px;
    }
    .save-msg.ok  { color: var(--fp-emerald-700); }
    .save-msg.err { color: var(--fp-rose-700); }

    .advanced-toggle {
      font-size: 11px;
      color: var(--fp-blue-600);
      cursor: pointer;
      display: inline-block;
      margin-top: 4px;
      user-select: none;
    }
    .advanced-toggle:hover { text-decoration: underline; }
    .advanced-block { display: none; }
    .advanced-block.visible { display: block; }

    /* Footer settings link */
    .footer {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--fp-slate-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer .left,
    .footer .right {
      font-size: 11px;
      color: var(--fp-slate-500);
    }
    .footer button {
      background: none;
      border: none;
      color: var(--fp-slate-500);
      font-size: 11px;
      cursor: pointer;
      padding: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .footer button:hover { color: var(--fp-slate-900); }
    .server-state {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .server-state .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--fp-slate-300);
    }
    .server-state.online .dot  { background: var(--fp-emerald-600); }
    .server-state.offline .dot { background: var(--fp-rose-600); }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">FP</div>
    <div>
      <div class="brand-name">FPXpress</div>
      <div class="brand-tag">Shipment intelligence</div>
    </div>
  </div>

  <div class="body">
    <!-- One-line status, plain language -->
    <div id="status" class="status setup" title="Click to edit setup">
      <span class="dot"></span>
      <div style="flex:1;min-width:0;">
        <div class="label" id="statusLabel">Setup needed</div>
        <div class="sub" id="statusSub">Add your name and API key to get started.</div>
      </div>
    </div>

    <!-- Primary CTA -->
    <button id="openBtn" class="btn-primary">Open workspace</button>
    <div class="hint">The workspace opens as a side panel and stays open while you work.</div>

    <!-- Inline setup form: visible when not configured, or when user clicks Settings -->
    <div id="setup" class="setup">
      <h4 id="setupTitle">First-time setup</h4>

      <div class="setup-step">
        <div class="num">1</div>
        <div class="body-col">
          <label for="nameInput">Your name</label>
          <input id="nameInput" type="text" placeholder="e.g. Neel Patel" autocomplete="off" spellcheck="false">
        </div>
      </div>

      <!-- Microsoft sign-in (preferred). Pop-up auth via chrome.identity. -->
      <div class="setup-step">
        <div class="num">2</div>
        <div class="body-col">
          <label>Sign in <span style="color:var(--fp-slate-500);font-weight:400;">(recommended)</span></label>
          <button id="msSignInBtn" type="button" style="
            width:100%;padding:8px 10px;font-size:12px;font-weight:600;
            border:1px solid var(--fp-slate-300);border-radius:6px;background:#fff;
            cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
            color:var(--fp-slate-900);">
            <svg width="14" height="14" viewBox="0 0 23 23" aria-hidden="true">
              <path fill="#f35325" d="M1 1h10v10H1z"/>
              <path fill="#81bc06" d="M12 1h10v10H12z"/>
              <path fill="#05a6f0" d="M1 12h10v10H1z"/>
              <path fill="#ffba08" d="M12 12h10v10H12z"/>
            </svg>
            <span id="msSignInLabel">Sign in with Microsoft</span>
          </button>
          <div id="msSignedInRow" style="display:none;margin-top:6px;font-size:11px;color:var(--fp-emerald-700);">
            Signed in as <b id="msSignedInEmail"></b>
            · <a href="#" id="msRecheckLink" style="color:var(--fp-blue-600);">Recheck approval</a>
            · <a href="#" id="msSignOutLink" style="color:var(--fp-slate-500);">Sign out</a>
          </div>
        </div>
      </div>

      <!-- API key path stays for service-to-service / admin distribution. -->
      <div class="setup-step">
        <div class="num">3</div>
        <div class="body-col">
          <label for="keyInput">…or API key <span style="color:var(--fp-slate-500);font-weight:400;">(from your admin)</span></label>
          <input id="keyInput" class="mono" type="password" placeholder="fpx_live_..." autocomplete="off" spellcheck="false">
        </div>
      </div>

      <div class="advanced-toggle" id="advToggle">⚙ Advanced</div>
      <div class="advanced-block" id="advBlock">
        <div class="setup-step" style="margin-top:8px;">
          <div class="num" style="background:var(--fp-slate-200);color:var(--fp-slate-700);">4</div>
          <div class="body-col">
            <label for="urlInput">API URL <span style="color:var(--fp-slate-500);font-weight:400;">(default works for most reps)</span></label>
            <input id="urlInput" class="mono" type="text" placeholder="https://your-app.up.railway.app" autocomplete="off" spellcheck="false">
          </div>
        </div>
      </div>

      <div class="setup-actions">
        <button id="saveKeyBtn" class="btn-primary" type="button" style="flex:2;">Save</button>
        <button id="cancelSetupBtn" class="btn-ghost" type="button" style="flex:1;">Cancel</button>
      </div>
      <div style="margin-top:8px;text-align:center;">
        <button id="importFileBtn" type="button" class="advanced-toggle" style="background:none;border:none;padding:0;font-size:11px;color:var(--fp-blue-600);cursor:pointer;">📂 Import config file from admin</button>
        <input id="importFileInput" type="file" accept=".js,.txt,.config" style="display:none;">
      </div>
      <div id="keyMsg" class="save-msg"></div>
    </div>

    <!-- Footer: server state + settings link -->
    <div class="footer">
      <div class="left">
        <span id="serverState" class="server-state offline">
          <span class="dot"></span>
          <span id="serverLabel">Server offline</span>
        </span>
      </div>
      <div class="right">
        <button id="settingsBtn" type="button" title="Edit setup">⚙ Settings</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
